<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fortnite Hub - Registrazione</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(0, 200, 255, 0.15),
                    transparent 40%
                ),

                radial-gradient(
                    circle at bottom right,
                    rgba(123, 44, 255, 0.15),
                    transparent 40%
                ),

                #070b16;

            color: white;

            padding: 20px;

        }


        .auth-container {

            width: 100%;

            max-width: 430px;

        }


        .logo {

            text-align: center;

            margin-bottom: 25px;

        }


        .logo img {

            width: 75px;

            height: 75px;

            object-fit: contain;

            margin-bottom: 10px;

        }


        .logo h1 {

            font-size: 28px;

            font-weight: 900;

        }


        .logo p {

            color: #8995af;

            margin-top: 7px;

        }


        .auth-card {

            background:
                rgba(13, 20, 38, 0.95);

            border:
                1px solid rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);

        }


        .auth-card h2 {

            text-align: center;

            margin-bottom: 25px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            color: #aab5cc;

        }


        .form-group input {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            background:
                #080d1b;

            color: white;

            outline: none;

            font-size: 15px;

        }


        .form-group input:focus {

            border-color: #00c8ff;

            box-shadow:
                0 0 15px
                rgba(0, 200, 255, 0.12);

        }


        .error {

            background:
                rgba(255, 60, 90, 0.1);

            border:
                1px solid
                rgba(255, 60, 90, 0.3);

            color: #ff8fa3;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;

        }


        .submit-button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #00c8ff,
                    #7b2cff
                );

            color: white;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.25s;

        }


        .submit-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(0, 200, 255, 0.2);

        }


        .bottom-text {

            text-align: center;

            margin-top: 22px;

            color: #8995af;

            font-size: 14px;

        }


        .bottom-text a {

            color: #00c8ff;

            text-decoration: none;

            font-weight: 700;

        }


        .home-link {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #68758f;

            text-decoration: none;

            font-size: 14px;

        }

    </style>

</head>


<body>


    <div class="auth-container">


        <div class="logo">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
                alt="Fortnite Hub"
            >

            <h1>Fortnite Hub</h1>

            <p>Crea il tuo account</p>

        </div>


        <div class="auth-card">


            <h2>Registrazione</h2>


            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('register') }}"
            >


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Il tuo username"
                        required
                        minlength="3"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="La tua email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Almeno 6 caratteri"
                        required
                        minlength="6"
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Crea account
                </button>


            </form>


            <div class="bottom-text">

                Hai già un account?

                <a href="{{ url_for('login') }}">
                    Accedi
                </a>

            </div>


        </div>


        <a
            href="/"
            class="home-link"
        >
            ← Torna alla Home
        </a>


    </div>


</body>

</html>
