name: Fortnite Hub Skin Tracker

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

jobs:
  check-shop:

    runs-on: ubuntu-latest

    steps:

      - name: Check Fortnite Hub
        run: |

          echo "========================================"
          echo "🔔 AVVIO FORTNITE HUB TRACKER"
          echo "========================================"

          URL="https://fortnite-hub-g6u2.onrender.com/api/tracker/check?secret=${{ secrets.CRON_SECRET }}"

          echo "🌐 Chiamata a Fortnite Hub..."

          RESPONSE=$(curl -sS \
            --max-time 60 \
            -w "\nHTTP_STATUS:%{http_code}" \
            "$URL") || {

              echo "❌ CURL FALLITO"
              exit 1
          }

          echo ""
          echo "========================================"
          echo "📡 RISPOSTA SERVER"
          echo "========================================"

          echo "$RESPONSE"

          echo ""
          echo "========================================"
          echo "🔎 CONTROLLO HTTP"
          echo "========================================"

          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | sed 's/HTTP_STATUS://')

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" != "200" ]; then

            echo "❌ IL SERVER HA RESTITUITO HTTP $STATUS"

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "✅ HTTP 200"
          echo "========================================"

          echo "$RESPONSE"

          echo ""
          echo "========================================"
          echo "🎉 TRACKER COMPLETATO"
          echo "========================================"
