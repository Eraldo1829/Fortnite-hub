name: Fortnite Hub Skin Tracker

on:
  workflow_dispatch:

jobs:
  check-shop:

    runs-on: ubuntu-24.04

    steps:

      - name: Check deployed tracker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "X-Cron-Secret: $CRON_SECRET" \
            https://fortnite-hub-g6u2.onrender.com/api/tracker/check
