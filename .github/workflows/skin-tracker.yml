name: Fortnite Hub Skin Tracker
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-tracker
  cancel-in-progress: false
jobs:
  check-shop:
    runs-on: ubuntu-24.04
    steps:
      - name: Check deployed shop and notify favorites
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --max-time 120 \
            -H "X-Cron-Secret: $CRON_SECRET" \
            https://fortnite-hub-g6u2.onrender.com/api/tracker/check
