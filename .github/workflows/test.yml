name: Test Fortnite Hub

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Test database
        run: python test.py

      - name: Test Flask
        run: python -c "from app import app; print('✅ Flask funziona!')"

      - name: Test Fortnite API
        env:
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
        run: python api_test.py
